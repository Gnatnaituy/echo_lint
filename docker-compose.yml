name: echolint

services:
  mysql:
    image: mysql:8.0
    container_name: echolint-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: echolint
      MYSQL_USER: audit
      MYSQL_PASSWORD: audit123
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 本机调试用：宿主 3307 → 容器 3306（若本机 3306 空闲可直接改 3306:3306）
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    image: echolint-backend
    container_name: echolint-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/echolint?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: audit
      SPRING_DATASOURCE_PASSWORD: audit123
      APP_UPLOAD_DIR: /app/data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AI 复筛/词挖掘可切换到 DeepSeek（系统设置页运行时切换，重启后仍生效）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 首次启动的默认复筛供应商（未在界面切换过时生效）：openai | deepseek
      APP_SCREEN_PROVIDER: ${APP_SCREEN_PROVIDER:-openai}
      # 转写改道到本机 whisper.cpp（Metal 加速，不占 Docker 的 CPU）：
      #   tools/whisper-server.sh --daemon
      #   .env 里设 WHISPER_BASE_URL=http://host.docker.internal:9900  WHISPER_API_KEY=local
      # 不设时保持默认，走 OPENAI_* 的官方 Whisper。
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-https://api.openai.com}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/data/uploads
    ports:
      # 本机 8080 若被其他服务占用，可改为 8082:8080 或任意空闲端口
      - "8082:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    image: echolint-frontend
    container_name: echolint-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8081:80"

volumes:
  mysql-data:
  uploads: