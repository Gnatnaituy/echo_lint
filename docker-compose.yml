name: echolint

services:
  # PostgreSQL 17 + pgvector：关系数据与向量检索共用一个实例（Batch 6）。
  # 镜像自带 vector 扩展；Flyway V2 会执行 CREATE EXTENSION。
  # 旧 MySQL 数据迁移见 docs/postgres-migration.md（先启动新版应用建表，再只搬数据）。
  postgres:
    image: pgvector/pgvector:pg17
    container_name: echolint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echolint
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit123
      PGTZ: Asia/Shanghai
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      # 本机调试用：宿主 5433 → 容器 5432（避免占用本机默认 5432）；只绑回环
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d echolint"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    image: echolint-backend
    container_name: echolint-backend
    restart: unless-stopped
    # 与 server.shutdown: graceful + spring.lifecycle.timeout-per-shutdown-phase: 20s 配合，
    # 给在途的上传/导出/流水线留出收尾时间
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/echolint
      SPRING_DATASOURCE_USERNAME: audit
      SPRING_DATASOURCE_PASSWORD: audit123
      APP_UPLOAD_DIR: /app/data/uploads
      # 阿里云百炼：RAG embedding（qwen3.7-text-embedding，1024 维）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # AI 复筛/词挖掘：DeepSeek（系统设置页运行时切换，重启后仍生效）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # AI 供应商密钥加密主密钥（生产必须配置；变更后旧密文无法解密，需要重新录入供应商密钥）
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      # AI 配额（0=不限）：每日 token 上限 / 每分钟请求数
      APP_SCREEN_DAILY_TOKEN_LIMIT: ${APP_SCREEN_DAILY_TOKEN_LIMIT:-0}
      APP_SCREEN_REQUESTS_PER_MINUTE: ${APP_SCREEN_REQUESTS_PER_MINUTE:-0}
      # 语义复筛 A/B 分流（只读配置，仅语义复筛参与）
      APP_SCREEN_AB_ENABLED: ${APP_SCREEN_AB_ENABLED:-false}
      APP_SCREEN_AB_PERCENT: ${APP_SCREEN_AB_PERCENT:-0}
      APP_SCREEN_AB_PROVIDER: ${APP_SCREEN_AB_PROVIDER:-}
      APP_SCREEN_AB_MODEL: ${APP_SCREEN_AB_MODEL:-}
      # 首次启动的默认复筛供应商（未在界面切换过时生效）：deepseek | aliyun
      APP_SCREEN_PROVIDER: ${APP_SCREEN_PROVIDER:-deepseek}
      # 首次启动引导管理员（仅当用户表为空时创建；生产务必覆盖默认密码）
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin12345}
      # 一条录音需要几个复核人通过才落最终结论：1=单人复核，2=双人复核
      APP_REVIEW_REQUIRED_APPROVALS: ${APP_REVIEW_REQUIRED_APPROVALS:-1}
      # RAG 检索增强（Batch 6）：默认关闭；打开后知识需先建索引（设置页可全量重建）
      APP_RAG_ENABLED: ${APP_RAG_ENABLED:-false}
      APP_RAG_TOP_K: ${APP_RAG_TOP_K:-4}
      APP_RAG_MIN_SCORE: ${APP_RAG_MIN_SCORE:-0.25}
      APP_RAG_MAX_CONTEXT_CHARS: ${APP_RAG_MAX_CONTEXT_CHARS:-2400}
      APP_RAG_CORPUS_EXAMPLES: ${APP_RAG_CORPUS_EXAMPLES:-5}
      # embedding 复用 AI 供应商（需在 ai_providers 中配置密钥；DeepSeek 不支持 embedding）
      APP_RAG_EMBEDDING_PROVIDER: ${APP_RAG_EMBEDDING_PROVIDER:-aliyun}
      APP_RAG_EMBEDDING_MODEL: ${APP_RAG_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      APP_RAG_EMBEDDING_DIMENSIONS: ${APP_RAG_EMBEDDING_DIMENSIONS:-1024}
      APP_RAG_EMBEDDING_SEND_DIMENSIONS: ${APP_RAG_EMBEDDING_SEND_DIMENSIONS:-true}
      APP_RAG_EMBEDDING_TIMEOUT: ${APP_RAG_EMBEDDING_TIMEOUT:-30}
      APP_RAG_EMBEDDING_PATH: ${APP_RAG_EMBEDDING_PATH:-/embeddings}
      APP_RAG_EMBEDDING_BATCH_SIZE: ${APP_RAG_EMBEDDING_BATCH_SIZE:-8}
      APP_RAG_CHUNK_CHARS: ${APP_RAG_CHUNK_CHARS:-600}
      APP_RAG_CHUNK_OVERLAP: ${APP_RAG_CHUNK_OVERLAP:-80}
      APP_RAG_CORPUS_MAX_CHARS: ${APP_RAG_CORPUS_MAX_CHARS:-6000}
      APP_RAG_INDEX_POOL: ${APP_RAG_INDEX_POOL:-2}
      APP_RAG_STARTUP_BACKFILL: ${APP_RAG_STARTUP_BACKFILL:-true}
      APP_RAG_DOCUMENTS_DIR: /app/data/knowledge-docs
      APP_RAG_DOCUMENTS_MAX_BYTES: ${APP_RAG_DOCUMENTS_MAX_BYTES:-20971520}
      APP_RAG_DOCUMENTS_EXTENSIONS: ${APP_RAG_DOCUMENTS_EXTENSIONS:-pdf,docx,txt,md}
      # 转写固定走本机 whisper.cpp（Metal 加速，录音不出本机）：
      #   tools/whisper-server.sh --daemon
      #   .env 里设 WHISPER_BASE_URL=http://host.docker.internal:9900  WHISPER_API_KEY=local
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://host.docker.internal:9900}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-local}
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/data/uploads
      - knowledge-docs:/app/data/knowledge-docs
    ports:
      # 本机 8080 若被其他服务占用，可改为 8082:8080 或任意空闲端口；只绑回环供本机调试
      - "127.0.0.1:8082:8080"
    # 容器日志轮转，避免长时间运行写满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    image: echolint-frontend
    container_name: echolint-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # 本机调试入口：http://localhost:8081；只绑回环
      - "127.0.0.1:8081:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg-data:
  uploads:
  knowledge-docs:
