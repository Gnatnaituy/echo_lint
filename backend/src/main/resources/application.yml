server:
  port: 8080

spring:
  application:
    name: echolint
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/echolint?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:audit}
    password: ${SPRING_DATASOURCE_PASSWORD:audit123}
    hikari:
      maximum-pool-size: 8
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 210MB
      max-request-size: 220MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  upload-dir: ${APP_UPLOAD_DIR:data/uploads}
  # 上传大小上限。放宽到 200MB 以配合本地 whisper.cpp（无 25MB 限制）；
  # 若转写仍指向 OpenAI 官方 API，单文件仍受其 25MB 限制（启动日志会提示）。
  max-size-bytes: ${APP_MAX_SIZE_BYTES:209715200}
  allowed-extensions: mp3,wav,m4a,mp4,webm,ogg,flac,aac,amr,caf,opus,mov
  pipeline-pool-size: 2
  # 双声道（双轨）录音：ffmpeg 分离左右声道后分别转写，按时间对齐成对话
  stereo:
    enabled: ${APP_STEREO_ENABLED:true}
    left-speaker: ${APP_STEREO_LEFT_SPEAKER:坐席}
    right-speaker: ${APP_STEREO_RIGHT_SPEAKER:客户}
    split-timeout-seconds: 300
  # AI 语义复筛 + 敏感词挖掘所用的模型供应商（OpenAI 兼容 chat completions）。
  # 运行时可切换：当前选择存在 app_settings 表，界面入口为「系统设置」页，无需重启。
  screen-models:
    # 仅当 app_settings 尚无记录时生效（即首次启动的默认值）
    default-provider: ${APP_SCREEN_PROVIDER:openai}
    temperature: 0.1
    few-shot-count: 5
    request-timeout-seconds: 300
    providers:
      - id: openai
        label: OpenAI
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${OPENAI_API_KEY:}
        api-key-env: OPENAI_API_KEY
        chat-path: /v1/chat/completions
        default-model: ${OPENAI_SCREEN_MODEL:gpt-4o-mini}
        models:
          - gpt-4o-mini
          - gpt-4o
          - gpt-4.1-mini
        json-mode: true
      - id: deepseek
        label: DeepSeek
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        api-key-env: DEEPSEEK_API_KEY
        # DeepSeek 的 OpenAI 兼容端点为 /chat/completions（无 /v1 前缀）
        chat-path: /chat/completions
        default-model: ${DEEPSEEK_SCREEN_MODEL:deepseek-flash}
        models:
          - deepseek-flash
          - deepseek-v4-pro
        json-mode: true
        # JSON 模式下官方建议显式限制输出长度，避免 JSON 被中途截断
        max-tokens: 2048
        # 透传字段：如需开思考模式可加 thinking: {type: enabled}
        extra-body: {}

# 语音转写（ASR）。默认走 OpenAI Whisper；可用 WHISPER_* 指向自建服务，
# 例如本机 whisper.cpp（见 tools/whisper-server.sh）：录音不出本机、无时长费用、无并发限制。
#
# 注意：前缀刻意用 whisper 而不是复用 openai —— docker-compose 会注入空的
# OPENAI_API_KEY=""，而环境变量按宽松绑定等价于 openai.api-key 且优先级高于本文件，
# 会把这里解析好的值整个盖掉。独立前缀与环境变量 WHISPER_* 一一对应，不受影响。
whisper:
  # 系统设置页切换的复筛模型与此无关，两者互不影响
  base-url: ${WHISPER_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
  api-key: ${WHISPER_API_KEY:${OPENAI_API_KEY:}}
  model: ${OPENAI_WHISPER_MODEL:whisper-1}
  # 本地 whisper.cpp 处理长音频较慢，超时给宽一些
  request-timeout-seconds: 600