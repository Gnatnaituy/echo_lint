server:
  port: 8080
  # 优雅停机：先停止接收新请求，再等待在途请求（含上传/导出）完成，最多 20s
  shutdown: graceful
  servlet:
    session:
      cookie:
        # 会话 cookie 由浏览器自动携带（前端不存 token），HttpOnly 防 XSS 读取，SameSite=Lax 防 CSRF
        http-only: true
        same-site: lax

spring:
  application:
    name: echolint
  # 优雅停机的单阶段超时（与 server.shutdown: graceful 配合）
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # PostgreSQL 17 + pgvector。默认连本机 5432；docker compose 把容器映射到宿主 5433。
    # 连接池参数按单实例 8 连接配置，pgvector 的查询不额外占用连接。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/echolint}
    username: ${SPRING_DATASOURCE_USERNAME:audit}
    password: ${SPRING_DATASOURCE_PASSWORD:audit123}
    hikari:
      maximum-pool-size: 8
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # 版本化迁移：已存在的库由 baseline-on-migrate 直接登记为版本 1（不重复建表），
  # 全新的空库执行 V1（仅注释的基线标记）。后续结构变更从 V2__*.sql 开始。
  #
  # 注意：不能同时开启 spring.jpa.defer-datasource-initialization —— Boot 3.3 会把
  # EntityManagerFactory 视为「数据库初始化器」，与 Flyway 初始化器互相 depends-on，
  # 启动直接报 Circular depends-on。预置数据改由 DataSeedRunner 在 JPA 建表后执行。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  # data.sql 由 DataSeedRunner 在应用启动完成后执行（幂等），不再走 Boot 的 SQL 初始化流程
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 210MB
      max-request-size: 220MB

management:
  endpoints:
    web:
      exposure:
        # prometheus 应用层放行，部署层必须限制为内网/回环访问，切勿直接暴露公网
        include: health,info,prometheus

app:
  # AI 供应商 API Key 的 AES-GCM 主密钥（Batch 3a）。
  # 可填 Base64 编码的 32 字节，或任意字符串（自动 SHA-256 派生）；未配置时用开发默认值并 WARN。
  # 生产必须配置，且轮换后需重新录入供应商密钥（旧密文无法解密）。
  secret-key: ${APP_SECRET_KEY:}
  upload-dir: ${APP_UPLOAD_DIR:data/uploads}
  # 上传大小上限。放宽到 200MB 以配合本地 whisper.cpp（本地转写无 25MB 限制）。
  max-size-bytes: ${APP_MAX_SIZE_BYTES:209715200}
  allowed-extensions: mp3,wav,m4a,mp4,webm,ogg,flac,aac,amr,caf,opus,mov
  pipeline-pool-size: 2
  # 双声道（双轨）录音：ffmpeg 分离左右声道后分别转写，按时间对齐成对话
  stereo:
    enabled: ${APP_STEREO_ENABLED:true}
    left-speaker: ${APP_STEREO_LEFT_SPEAKER:坐席}
    right-speaker: ${APP_STEREO_RIGHT_SPEAKER:客户}
    split-timeout-seconds: 300
  # 复核工作流：一条录音需要几个复核人通过才落最终结论（1=单人，2=双人复核）
  review:
    required-approvals: ${APP_REVIEW_REQUIRED_APPROVALS:1}
  # 合规抽样（Batch 2b-2）：DFA 未命中的录音按此概率也送 AI 语义复筛，用于发现词典漏检。
  # 0=关闭（默认），1=全部抽检；AI 不可用/低置信度一律转人工复检，不会静默放行。
  sample:
    dfa-miss-rate: ${APP_SAMPLE_DFA_MISS_RATE:0.0}
  # Webhook 通知告警（Batch 2b-2）：复核确认违规 / 流水线失败 / 每日待复核积压 / 测试通知。
  # URL 只来自配置（避免运行时 SSRF）；配置 webhook-secret 后会带 X-EchoLint-Signature 签名头。
  notify:
    enabled: ${APP_NOTIFY_ENABLED:false}
    webhook-url: ${APP_NOTIFY_WEBHOOK_URL:}
    webhook-secret: ${APP_NOTIFY_WEBHOOK_SECRET:}
    timeout-seconds: ${APP_NOTIFY_TIMEOUT_SECONDS:5}
    backlog-threshold: ${APP_NOTIFY_BACKLOG_THRESHOLD:50}
  # ===================== 集成适配器（Batch 5） =====================
  # 全部默认关闭，关闭时行为与之前完全一致；状态见 GET /api/settings/integrations（ADMIN）。
  # 契约、接入步骤与安全/回滚说明见 docs/integrations.md。
  # 多租户：本轮只解析租户上下文，不做数据隔离。HEADER 模式下 /api/** 必须带租户头，
  # 缺失/非法（1~64 位字母/数字/下划线/中划线）返回 JSON 400。
  tenant:
    enabled: ${APP_TENANT_ENABLED:false}
    mode: ${APP_TENANT_MODE:SINGLE}
    header: ${APP_TENANT_HEADER:X-Tenant-Id}
  # SSO / LDAP：只暴露状态与登录跳转地址，不引入身份源客户端；密钥只从环境变量注入。
  sso:
    enabled: ${APP_SSO_ENABLED:false}
    provider: ${APP_SSO_PROVIDER:OIDC}
    issuer: ${APP_SSO_ISSUER:}
    client-id: ${APP_SSO_CLIENT_ID:}
    client-secret: ${APP_SSO_CLIENT_SECRET:}
    # IdP 组 → 本地角色（ADMIN/REVIEWER/VIEWER）映射，JSON 字符串
    role-mapping-json: ${APP_SSO_ROLE_MAPPING_JSON:}
  # 实时（流式）转写：默认关闭，不改变现有批量转写流程。
  asr:
    streaming:
      enabled: ${APP_ASR_STREAMING_ENABLED:false}
      provider: ${APP_ASR_STREAMING_PROVIDER:}
      endpoint: ${APP_ASR_STREAMING_ENDPOINT:}
      api-key: ${APP_ASR_STREAMING_API_KEY:}
  # 单声道说话人分离：默认关闭；双声道仍走现有左右声道方案。
  diarization:
    enabled: ${APP_DIARIZATION_ENABLED:false}
    provider: ${APP_DIARIZATION_PROVIDER:}
    endpoint: ${APP_DIARIZATION_ENDPOINT:}
    api-key: ${APP_DIARIZATION_API_KEY:}
  # 首次启动引导管理员（用户表为空时创建；生产请务必通过环境变量覆盖密码）
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin12345}
  # AI 语义复筛 + 敏感词挖掘所用的模型供应商（兼容 chat completions 协议）。
  # 运行时可切换：当前选择存在 app_settings 表，界面入口为「系统设置」页，无需重启。
  screen-models:
    # 仅当 app_settings 尚无记录时生效（即首次启动的默认值）
    default-provider: ${APP_SCREEN_PROVIDER:deepseek}
    temperature: 0.1
    few-shot-count: 5
    request-timeout-seconds: 300
    # 全文分块复核（Batch 2b-2）：单次最多送 12000 字符，超出后带重叠分块逐块调用；
    # 最多复核 6 段（其余截断并在日志注明），任一段违规即整体违规。
    chunk-chars: ${APP_SCREEN_CHUNK_CHARS:12000}
    max-chunks: ${APP_SCREEN_MAX_CHUNKS:6}
    # violation=true 但置信度低于该值时降级人工复核（不允许自动放行）
    min-confidence: ${APP_SCREEN_MIN_CONFIDENCE:0.6}
    # AI 配额（Batch 3a）：0 = 不限。每日 token 为输入+输出合计（查 ai_invocations 当日累计）；
    # 每分钟调用次数按供应商在进程内计数。超限不发起调用，抛错后流水线降级人工复核。
    daily-token-limit: ${APP_SCREEN_DAILY_TOKEN_LIMIT:0}
    requests-per-minute: ${APP_SCREEN_REQUESTS_PER_MINUTE:0}
    # 语义复筛 A/B 分流（Batch 3b-2，只读配置）：按 percent 概率把复筛流量分流到备用供应商，
    # 仅语义复筛参与，词挖掘仍走当前生效模型；备用不可用时自动回退 A 组。
    ab:
      enabled: ${APP_SCREEN_AB_ENABLED:false}
      percent: ${APP_SCREEN_AB_PERCENT:0}
      provider-id: ${APP_SCREEN_AB_PROVIDER:}
      model: ${APP_SCREEN_AB_MODEL:}
    providers:
      # 阿里云百炼：主要用于 RAG embedding（也提供 chat 兼容接口，可作为备用复筛模型）。
      # base-url 已包含 /compatible-mode/v1，embedding 路径为 /embeddings。
      - id: aliyun
        label: 阿里云百炼
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:}
        api-key-env: DASHSCOPE_API_KEY
        chat-path: /chat/completions
        default-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
        models:
          - qwen-plus
          - qwen-max
          - qwen-turbo
        json-mode: false
      - id: deepseek
        label: DeepSeek
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        api-key-env: DEEPSEEK_API_KEY
        # DeepSeek 的兼容端点为 /chat/completions（无 /v1 前缀）
        chat-path: /chat/completions
        default-model: ${DEEPSEEK_SCREEN_MODEL:deepseek-flash}
        models:
          - deepseek-flash
          - deepseek-v4-pro
        json-mode: true
        # JSON 模式下官方建议显式限制输出长度，避免 JSON 被中途截断
        max-tokens: 2048
        # 透传字段：如需开思考模式可加 thinking: {type: enabled}
        extra-body: {}

  # ===================== RAG 检索增强（Batch 6）=====================
  # 知识库/SOP + 人工复核语料的向量检索，注入 AI 语义复筛的提示词。
  # 默认关闭：enabled=false 时不发起任何 embedding 调用，复筛行为与旧版完全一致。
  # embedding 复用 ai_providers 的 base-url / api-key（AES-GCM 加密），只额外指定模型与路径；
  # 服务不可用时自动降级为「不注入检索结果」，绝不阻塞复筛。
  rag:
    enabled: ${APP_RAG_ENABLED:false}
    # 知识库召回条数与相似度下限（余弦相似度 0~1，低于阈值的片段丢弃）
    top-k: ${APP_RAG_TOP_K:4}
    min-score: ${APP_RAG_MIN_SCORE:0.25}
    # 注入提示词的知识片段总字符上限，避免长录音分块叠加后把上下文撑爆
    max-context-chars: ${APP_RAG_MAX_CONTEXT_CHARS:2400}
    # 语义 few-shot（Phase A）：从语料库按相似度取样例，不足时用最新样本补齐
    corpus-examples: ${APP_RAG_CORPUS_EXAMPLES:5}
    embedding:
      # 复用 ai_providers 中的阿里云百炼供应商（需配置 DASHSCOPE_API_KEY）
      provider-id: ${APP_RAG_EMBEDDING_PROVIDER:aliyun}
      model: ${APP_RAG_EMBEDDING_MODEL:qwen3.7-text-embedding}
      # base-url 已含 /compatible-mode/v1，这里只写 /embeddings
      path: ${APP_RAG_EMBEDDING_PATH:/embeddings}
      # 维度必须与 V3 迁移里 HNSW 表达式索引的维度一致（默认 1024）
      dimensions: ${APP_RAG_EMBEDDING_DIMENSIONS:1024}
      # 显式发送 dimensions（阿里云 qwen3.7 / text-embedding-v3/v4 支持）
      send-dimensions: ${APP_RAG_EMBEDDING_SEND_DIMENSIONS:true}
      timeout-seconds: ${APP_RAG_EMBEDDING_TIMEOUT:30}
      batch-size: ${APP_RAG_EMBEDDING_BATCH_SIZE:8}
    chunk:
      # 知识库条目分块长度（字符）与重叠；中文按段落/句号切分
      chars: ${APP_RAG_CHUNK_CHARS:600}
      overlap: ${APP_RAG_CHUNK_OVERLAP:80}
    corpus:
      # 语料库样本做 embedding 前的截断长度（完整转写可能很长）
      max-chars: ${APP_RAG_CORPUS_MAX_CHARS:6000}
    index:
      # 异步索引线程数；启动时是否自动回填未索引条目
      pool-size: ${APP_RAG_INDEX_POOL:2}
      startup-backfill: ${APP_RAG_STARTUP_BACKFILL:true}
    # 文档导入（Phase D）：PDF/DOCX/TXT/MD 解析后写入知识库条目
    documents:
      dir: ${APP_RAG_DOCUMENTS_DIR:data/knowledge-docs}
      max-bytes: ${APP_RAG_DOCUMENTS_MAX_BYTES:20971520}
      extensions: ${APP_RAG_DOCUMENTS_EXTENSIONS:pdf,docx,txt,md}

# 语音转写（ASR）：只支持自建/本机 whisper.cpp（见 tools/whisper-server.sh），不再依赖境外转写服务。
# 录音不出本机、无时长费用、无并发限制；Docker 内通过 host.docker.internal 访问宿主服务。
# 独立 whisper.* 前缀与 WHISPER_* 环境变量一一对应，避免与其它供应商变量互相遮蔽。
whisper:
  # 系统设置页切换的复筛模型与此无关，两者互不影响
  base-url: ${WHISPER_BASE_URL:http://127.0.0.1:9900}
  api-key: ${WHISPER_API_KEY:local}
  model: ${WHISPER_MODEL:whisper-1}
  # 本地 whisper.cpp 处理长音频较慢，超时给宽一些
  request-timeout-seconds: 600