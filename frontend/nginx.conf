server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 隐藏 nginx 版本号（P2-25）
    server_tokens off;

    # ---- 安全响应头（P2-25）----
    # CSP：生产构建的 Vue 3 运行时不需要 eval / new Function；Element Plus 会注入内联 <style>，
    # 因此 style-src 保留 'unsafe-inline'，其余资源全部同源。
    # 注意：nginx 的 add_header 不会跨层继承——下方 /assets/ 与 = /index.html 自带 add_header，
    # 必须在各自 location 内重复这 5 项安全头（保持完全一致）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

    # 上传口径与后端 app.max-size-bytes（默认 200MiB = 209715200 字节）对齐：
    # 200MiB 文件 + multipart 边界/表单开销 < 201MiB；>200MiB 的文件由 nginx 直接 413，
    # 不再「先传完 220MB 再被应用拒绝」。multipart 的 max-request-size 为 220MB（见 application.yml）。
    client_max_body_size 201m;

    # 静态资源压缩（Batch 4b）：js/css/json/svg 文本资源启用 gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 让后端识别原始协议（置于 TLS 反代后时该值为 https）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        # 上传（最大 200MiB）流式转发给后端，不在 nginx 容器可写层整份落盘（P2-26）
        proxy_request_buffering off;
    }

    # 录音文件静态访问（播放/拖动进度依赖流式响应，不能整份缓冲到临时文件；P2-26）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
    }

    # 构建产物带内容哈希：长缓存 + immutable，升级后旧文件自然失效
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header 不跨层继承，这里重复服务级安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
        access_log off;
    }

    # index.html 不缓存，保证发布后立即拿到新的资源引用（SPA fallback 仍走 /）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # add_header 不跨层继承，这里重复服务级安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
        expires -1;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
