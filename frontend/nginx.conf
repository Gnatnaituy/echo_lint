server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 与后端 app.max-size-bytes（默认 200MB）对齐；用 OpenAI 官方 Whisper 时单文件仍受其 25MB 限制
    client_max_body_size 220m;

    # 静态资源压缩（Batch 4b）：js/css/json/svg 文本资源启用 gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # 录音文件静态访问
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 构建产物带内容哈希：长缓存 + immutable，升级后旧文件自然失效
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 不缓存，保证发布后立即拿到新的资源引用（SPA fallback 仍走 /）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
